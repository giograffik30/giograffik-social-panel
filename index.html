<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giograffik TikTok Publisher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6 shadow-2xl">
    <!-- HEADER -->
    <div class="flex items-center space-x-3 border-b border-slate-800 pb-4">
      <div class="w-12 h-12 rounded-xl bg-black border border-cyan-500/50 flex items-center justify-center text-cyan-400 text-2xl">
        <i class="fa-brands fa-tiktok"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Giograffik <span class="text-cyan-400">TikTok Publisher</span></h1>
        <p class="text-xs text-slate-400">Publicador Oficial mediante TikTok Content Posting API</p>
      </div>
    </div>

    <!-- SUBIDA DE VIDEO / MULTIMEDIA -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-300">SELECCIONA TU VIDEO O FOTO PARA TIKTOK</label>
      <input type="file" id="tiktok-file" accept="video/*,image/*" onchange="loadTikTokMedia(event)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500">
    </div>

    <!-- PREVISUALIZACIÓN -->
    <div id="preview-box" class="aspect-[9/16] max-h-64 bg-black rounded-xl border border-slate-800 flex items-center justify-center overflow-hidden mx-auto hidden relative">
      <video id="preview-video" controls class="w-full h-full object-cover hidden"></video>
      <img id="preview-img" class="w-full h-full object-cover hidden" alt="Preview">
    </div>

    <!-- DESCRIPCIÓN Y HASHTAGS -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-300">DESCRIPCIÓN Y HASHTAGS DE TIKTOK</label>
      <textarea id="tiktok-caption" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-cyan-500" placeholder="Escribe el texto de tu video de sublimación... #Giograffik #Sublimacion #Bolivia"></textarea>
    </div>

    <!-- CLIENT KEY / APP ID -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-400">TIKTOK CLIENT KEY (CLAVE DE CLIENTE)</label>
      <input type="text" id="tiktok-client-key" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs font-mono text-cyan-400" placeholder="Pega tu Client Key de TikTok Developers">
    </div>

    <!-- BOTÓN DE PUBLICACIÓN -->
    <button onclick="shareToTikTok()" class="w-full py-4 bg-gradient-to-r from-cyan-500 via-teal-500 to-indigo-600 hover:opacity-95 text-white font-bold rounded-xl text-xs shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center space-x-2">
      <i class="fa-brands fa-tiktok text-base"></i>
      <span>PUBLICAR EN MI CUENTA DE TIKTOK (@giograffik)</span>
    </button>
  </div>

  <script>
    let selectedFile = null;

    window.onload = function() {
      const savedKey = localStorage.getItem('giograffik_tiktok_client_key') || '';
      document.getElementById('tiktok-client-key').value = savedKey;
    };

    function loadTikTokMedia(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        const previewBox = document.getElementById('preview-box');
        const previewVideo = document.getElementById('preview-video');
        const previewImg = document.getElementById('preview-img');
        
        previewBox.classList.remove('hidden');
        const url = URL.createObjectURL(file);

        if (file.type.startsWith('video/')) {
          previewImg.classList.add('hidden');
          previewVideo.src = url;
          previewVideo.classList.remove('hidden');
        } else {
          previewVideo.classList.add('hidden');
          previewImg.src = url;
          previewImg.classList.remove('hidden');
        }
      }
    }

    function shareToTikTok() {
      const clientKey = document.getElementById('tiktok-client-key').value.trim();
      const caption = document.getElementById('tiktok-caption').value.trim();

      if (!clientKey) {
        alert("⚠️ Ingresa tu TikTok Client Key antes de continuar.");
        return;
      }

      if (!selectedFile) {
        alert("⚠️ Por favor selecciona un video o imagen para TikTok.");
        return;
      }

      localStorage.setItem('giograffik_tiktok_client_key', clientKey);

      // Redirección oficial de la API de TikTok OAuth v2
      const redirectUri = encodeURIComponent(window.location.href);
      const scope = encodeURIComponent('user.info.basic,video.upload,video.publish');
      const state = encodeURIComponent(caption || 'giograffik_post');

      const tiktokAuthUrl = `https://www.tiktok.com/v2/auth/authorize/?client_key=${clientKey}&response_type=code&scope=${scope}&redirect_uri=${redirectUri}&state=${state}`;

      // Abrir flujo oficial de autorización de TikTok
      window.location.href = tiktokAuthUrl;
    }
  </script>
</body>
</html>
