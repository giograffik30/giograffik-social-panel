<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giograffik Mobile Phone Simulator v6.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    
    /* Estilo de marco de teléfono real */
    .phone-frame {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 12px #1e293b, 0 0 0 14px #0f172a;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-4">

  <!-- CONTENEDOR PRINCIPAL: DISPOSITIVO MÓVIL VIRTUAL -->
  <div class="phone-frame w-full max-w-[390px] h-[800px] bg-black rounded-[40px] overflow-hidden flex flex-col relative border-4 border-slate-800">
    
    <!-- BARRA DE ESTADO SUPERIOR (IOS / ANDROID STYLE) -->
    <div class="bg-slate-950 text-white px-6 py-3 flex justify-between items-center text-xs z-30 select-none">
      <span id="phone-clock" class="font-semibold">11:31</span>
      <!-- Isla Dinámica / Notch -->
      <div class="w-28 h-5 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2 flex items-center justify-center space-x-2 border border-slate-800">
        <div class="w-2.5 h-2.5 rounded-full bg-slate-900"></div>
        <div class="w-2 h-2 rounded-full bg-cyan-950 animate-pulse"></div>
      </div>
      <div class="flex items-center space-x-2 text-[10px]">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-three-quarters text-cyan-400"></i>
      </div>
    </div>

    <!-- PANTALLA PRINCIPAL (ESCRITORIO MÓVIL) -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6 relative bg-gradient-to-b from-slate-950 via-slate-900 to-black">
      
      <!-- WIDGET DE BIENVENIDA GIOGRAFFIK -->
      <div class="bg-gradient-to-r from-cyan-950/60 to-slate-900 border border-cyan-500/30 rounded-2xl p-4 flex items-center space-x-3 shadow-lg">
        <div class="w-12 h-12 rounded-xl bg-black border border-cyan-500 flex items-center justify-center text-cyan-400 text-xl shadow-cyan-500/20 shadow-md">
          <i class="fa-brands fa-tiktok"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm text-white">Giograffik <span class="text-cyan-400">Mobile Hub</span></h1>
          <p class="text-[10px] text-slate-400">Entorno móvil para gestión y acceso directo</p>
        </div>
      </div>

      <!-- ACCESO DIRECTO PRINCIPAL A TIKTOK MÓVIL -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Navegación Oficial</label>
        
        <button onclick="openTikTokMobile()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-95 text-white p-4 rounded-2xl flex items-center justify-between shadow-lg shadow-cyan-500/20 transition-all group">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-black/30 flex items-center justify-center text-lg">
              <i class="fa-brands fa-tiktok"></i>
            </div>
            <div class="text-left">
              <p class="font-bold text-xs">Abrir TikTok Móvil</p>
              <p class="text-[10px] text-cyan-100 opacity-90">Ver feed, perfil y videos de @giograffik</p>
            </div>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-xs group-hover:translate-x-0.5 transition-transform"></i>
        </button>
      </div>

      <!-- APPS / HERRAMIENTAS INTERNAS DEL MÓVIL -->
      <div class="space-y-2">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Aplicaciones del Sistema</label>
        
        <div class="grid grid-cols-3 gap-3">
          <!-- App 1: Perfil -->
          <button onclick="openLink('https://www.tiktok.com/@giograffik')" class="bg-slate-900/80 hover:bg-slate-800 border border-slate-800 p-3 rounded-2xl flex flex-col items-center text-center space-y-2 transition-all">
            <div class="w-10 h-10 rounded-xl bg-pink-600/20 text-pink-500 flex items-center justify-center text-base">
              <i class="fa-solid fa-user"></i>
            </div>
            <span class="text-[10px] font-medium text-slate-300">Mi Perfil</span>
          </button>

          <!-- App 2: Creador Studio -->
          <button onclick="openLink('https://creator.tiktok.com/')" class="bg-slate-900/80 hover:bg-slate-800 border border-slate-800 p-3 rounded-2xl flex flex-col items-center text-center space-y-2 transition-all">
            <div class="w-10 h-10 rounded-xl bg-cyan-600/20 text-cyan-400 flex items-center justify-center text-base">
              <i class="fa-solid fa-chart-line"></i>
            </div>
            <span class="text-[10px] font-medium text-slate-300">Creator Hub</span>
          </button>

          <!-- App 3: Diseños / Web -->
          <button onclick="openLink('https://giograffik.com')" class="bg-slate-900/80 hover:bg-slate-800 border border-slate-800 p-3 rounded-2xl flex flex-col items-center text-center space-y-2 transition-all">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-base">
              <i class="fa-solid fa-globe"></i>
            </div>
            <span class="text-[10px] font-medium text-slate-300">Giograffik.com</span>
          </button>
        </div>
      </div>

      <!-- SIMULADOR DE NOTIFICACIONES / ESTADO -->
      <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 space-y-2">
        <div class="flex items-center justify-between text-[10px] text-slate-400">
          <span class="flex items-center space-x-1.5"><i class="fa-regular fa-bell text-cyan-400"></i> <span>Actividad reciente</span></span>
          <span class="text-cyan-400 font-bold">En línea</span>
        </div>
        <p class="text-xs text-slate-300 font-medium">El simulador está listo para conectarse con tu cuenta activa de TikTok.</p>
      </div>

    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR DEL TELÉFONO (HOME BAR) -->
    <div class="bg-slate-950 py-3 px-6 flex justify-around items-center border-t border-slate-900 z-30">
      <button onclick="updateUI()" class="text-slate-400 hover:text-cyan-400 text-sm"><i class="fa-solid fa-rotate-left"></i></button>
      <button onclick="openTikTokMobile()" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-white hover:bg-cyan-500 hover:text-black transition-all shadow-md"><i class="fa-solid fa-circle"></i></button>
      <button onclick="clearSession()" class="text-slate-400 hover:text-rose-400 text-sm"><i class="fa-solid fa-power-off"></i></button>
    </div>

  </div>

  <script>
    // Actualizar reloj en tiempo real dentro del teléfono
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('phone-clock').innerText = `${hours}:${minutes}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openTikTokMobile() {
      // Abre TikTok en una pestaña nueva optimizada para móvil
      window.open('https://www.tiktok.com/mobile', '_blank');
    }

    function openLink(url) {
      window.open(url, '_blank');
    }

    function clearSession() {
      if(confirm("¿Reiniciar entorno móvil?")) {
        location.reload();
      }
    }
  </script>
</body>
</html>
